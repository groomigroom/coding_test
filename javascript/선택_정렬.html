<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택 정렬</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <script>
        let array = [1, 2, 45, 33, 22, 234, 21, 23];
        const n = array.length;
        for(let i = 0; i < n-1; i++) {
            let tmp;
            let minIdx = i;
            for(let k = i+1; k < n; k++) {
                if(array[minIdx] > array[k]) {
                    minIdx = k;                   
                }
            }
            tmp = array[i];
            array[i] = array[minIdx];
            array[minIdx] = tmp;
        }
        console.log(array);
    </script>
  </body>
</html>
